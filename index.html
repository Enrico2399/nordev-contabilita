<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nordev — Contabilità</title>
<style>
  :root{
    --bg:#f4f5f9;
    --surface:#ffffff;
    --surface-2:#f8f9fc;
    --border:#e4e6ee;
    --text:#171923;
    --text-dim:#5b6172;
    --text-faint:#8b90a0;
    --primary:#4338ca;
    --primary-soft:#eef0fd;
    --success:#0f9d58;
    --success-soft:#e7f7ee;
    --danger:#d93025;
    --danger-soft:#fdeceb;
    --warn:#b5730a;
    --warn-soft:#fbf1de;
    --neutral-soft:#eef0f4;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,20,43,.04), 0 6px 20px rgba(20,20,43,.06);
    --maxw:880px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1117;
      --surface:#171a23;
      --surface-2:#1d2029;
      --border:#2a2e3a;
      --text:#eef0f6;
      --text-dim:#a5aabb;
      --text-faint:#767c8f;
      --primary:#8b93f8;
      --primary-soft:#242a4d;
      --success:#4ade80;
      --success-soft:#123322;
      --danger:#f87171;
      --danger-soft:#3a1c1c;
      --warn:#f5b942;
      --warn-soft:#3a2f14;
      --neutral-soft:#242833;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  a{color:inherit;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px;}

  header.top{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:12px;}
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;}
  .brand .sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;
  }
  .badge.ok{background:var(--success-soft);color:var(--success);}
  .badge.warn{background:var(--warn-soft);color:var(--warn);}
  .badge.bad{background:var(--danger-soft);color:var(--danger);}
  .badge.neutral{background:var(--neutral-soft);color:var(--text-dim);}

  nav.tabs{
    display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    border:none;background:transparent;color:var(--text-dim);
    font-size:14px;font-weight:600;padding:9px 14px;border-radius:99px;cursor:pointer;
    transition:background .15s, color .15s;
    white-space:nowrap;
    min-height:44px;
  }
  nav.tabs button.active{background:var(--primary);color:#fff;}
  nav.tabs button:not(.active):hover{background:var(--surface-2);}

  main{padding-top:16px;}
  section.view{display:none;}
  section.view.active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  h2.section-title{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin:22px 0 10px;font-weight:700;}
  h2.section-title:first-child{margin-top:0;}

  .cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media (min-width:560px){.cards-grid{grid-template-columns:repeat(4,1fr);}}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 14px 12px;box-shadow:var(--shadow);
  }
  .stat-card .label{font-size:12px;color:var(--text-faint);font-weight:600;margin-bottom:6px;}
  .stat-card .value{font-size:20px;font-weight:700;letter-spacing:-.01em;}
  .stat-card .value.pos{color:var(--success);}
  .stat-card .value.neg{color:var(--danger);}
  .stat-card .foot{font-size:11.5px;color:var(--text-faint);margin-top:4px;}

  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
  }
  .panel-title{font-weight:700;font-size:15px;margin:0 0 4px;}
  .panel-note{font-size:13px;color:var(--text-dim);margin:0 0 10px;line-height:1.5;}

  .searchbar{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:14px;
  }
  .searchbar input{
    border:none;outline:none;background:transparent;color:var(--text);font-size:15px;width:100%;
  }
  .searchbar input::placeholder{color:var(--text-faint);}
  .searchbar svg{flex:0 0 auto;color:var(--text-faint);}

  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
    padding:7px 13px;border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;
    min-height:40px;display:inline-flex;align-items:center;
  }
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:13.5px;color:var(--text-dim);}
  .switch{
    position:relative;width:38px;height:22px;border-radius:99px;background:var(--neutral-soft);
    border:1px solid var(--border);cursor:pointer;flex:0 0 auto;
  }
  .switch.on{background:var(--primary);border-color:var(--primary);}
  .switch::after{
    content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .switch.on::after{left:18px;}

  .movimento{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;background:var(--surface-2);}
  .movimento .mtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .movimento .mdesc{font-weight:700;font-size:14.5px;}
  .movimento .mdate{font-size:12px;color:var(--text-faint);white-space:nowrap;}
  .movimento .mamt{font-weight:700;color:var(--success);font-size:15px;margin-top:2px;}
  .righe{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;display:grid;gap:5px;}
  .riga{display:flex;justify-content:space-between;font-size:13px;gap:8px;}
  .riga .rc{color:var(--text-dim);}
  .riga .rv{font-variant-numeric:tabular-nums;font-weight:600;}
  .riga .rv.dare{color:var(--text);}
  .riga .rv.avere{color:var(--text);}
  .tag-dare, .tag-avere{
    font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:6px;
  }
  .tag-dare{background:var(--primary-soft);color:var(--primary);}
  .tag-avere{background:var(--warn-soft);color:var(--warn);}
  .riclass-chip{
    display:inline-block;font-size:10.5px;font-weight:600;color:var(--text-faint);
    background:var(--neutral-soft);border-radius:6px;padding:1px 6px;margin-top:3px;margin-left:22px;
  }
  .computed-mark{font-size:10.5px;font-weight:600;color:var(--text-faint);margin-left:5px;}

  details.cat{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;background:var(--surface-2);}
  details.cat > summary{
    list-style:none;cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;
    font-weight:700;font-size:13.5px;
  }
  details.cat > summary::-webkit-details-marker{display:none;}
  details.cat > summary .chev{transition:transform .15s;color:var(--text-faint);font-size:12px;}
  details.cat[open] > summary .chev{transform:rotate(90deg);}
  .cat-items{padding:0 14px 10px;}
  .conto-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:8px 0;border-top:1px solid var(--border);font-size:13.5px;
  }
  .conto-row:first-child{border-top:none;}
  .conto-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .conto-code{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .conto-name{line-height:1.3;}
  .conto-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;}
  .pill.attivo{background:var(--primary-soft);color:var(--primary);}
  .pill.passivo{background:var(--warn-soft);color:var(--warn);}
  .pill.ricavo{background:var(--success-soft);color:var(--success);}
  .pill.costo{background:var(--danger-soft);color:var(--danger);}
  .pill.transitorio, .pill.chiusura{background:var(--neutral-soft);color:var(--text-dim);}
  .saldo-val{font-weight:700;font-variant-numeric:tabular-nums;min-width:64px;text-align:right;}
  .saldo-val.zero{color:var(--text-faint);font-weight:500;}

  .bilancio-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;font-size:13.5px;border-top:1px solid var(--border);}
  .bilancio-row:first-child{border-top:none;}
  .bilancio-row .lbl{min-width:0;}
  .bilancio-row .val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
  .bilancio-row.total{font-weight:700;background:var(--surface-2);margin:4px -14px;padding:9px 14px;border-radius:8px;border-top:none;}
  .bilancio-row.lvl0{font-weight:700;margin-top:6px;}
  .bilancio-row.lvl1 .lbl{padding-left:14px;}
  .bilancio-row.lvl2 .lbl{padding-left:28px;color:var(--text-dim);}
  .bilancio-row.lvl3 .lbl{padding-left:42px;color:var(--text-dim);}
  .val.na{color:var(--text-faint);font-style:italic;font-weight:500;}

  .subtabs{display:flex;gap:6px;margin-bottom:12px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--border);}
  .subtabs button{flex:1;border:none;background:transparent;padding:8px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--text-dim);cursor:pointer;min-height:42px;}
  .subtabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

  .empty{text-align:center;color:var(--text-faint);font-size:13.5px;padding:30px 10px;}
  footer.foot{text-align:center;color:var(--text-faint);font-size:11.5px;padding:26px 16px 10px;line-height:1.6;}
  .note-box{
    display:flex;gap:9px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.5;margin-bottom:14px;
  }
  .note-box b{color:inherit;}

  .draft-banner{
    display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap;
    background:var(--primary-soft);color:var(--primary);border-radius:12px;padding:10px 13px;font-size:12.5px;line-height:1.5;margin-bottom:14px;
  }
  .draft-banner button{border:none;background:var(--primary);color:#fff;font-weight:700;font-size:12px;padding:6px 11px;border-radius:8px;cursor:pointer;}

  .btn{
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    font-size:14px;font-weight:700;padding:11px 14px;border-radius:12px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--shadow);
    min-height:44px;
  }
  .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;}
  .btn.secondary{background:var(--surface-2);color:var(--text-dim);font-size:12.5px;font-weight:700;box-shadow:none;min-height:40px;}
  .btn.small{padding:8px 11px;font-size:12px;border-radius:9px;box-shadow:none;min-height:40px;}
  .btn.danger{color:var(--danger);}
  .btn-block{display:flex;width:100%;margin-bottom:10px;}
  .toolbar-secondary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
  .toolbar-secondary .btn{width:100%;}

  .form-panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:16px;
  }
  .form-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
  .form-panel-head h3{margin:0;font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .form-close{
    flex:0 0 auto;border:none;background:var(--neutral-soft);color:var(--text-dim);
    width:40px;height:40px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .field{margin-bottom:14px;min-width:0;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-dim);margin-bottom:6px;}
  .field input[type=text], .field input[type=date], .field input[type=number], .field select{
    width:100%;max-width:100%;box-sizing:border-box;border:1px solid var(--border);background:var(--surface-2);color:var(--text);
    border-radius:10px;padding:12px 12px;font-size:16px;outline:none;min-height:44px;
  }
  .field input:focus, .field select:focus{border-color:var(--primary);}
  .field-row{display:flex;gap:8px;min-width:0;}
  .field-row .field{flex:1;min-width:0;}
  .competenza-toggle{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);margin-bottom:14px;cursor:pointer;line-height:1.4;}
  .righe-editor{border-top:1px solid var(--border);padding-top:12px;margin-top:6px;}
  .riga-editor-row{
    display:grid;grid-template-columns:minmax(0,1fr);gap:8px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;max-width:100%;min-width:0;
  }
  .riga-editor-row .rr-top{display:flex;gap:8px;min-width:0;}
  .riga-editor-row select{flex:1;min-width:0;max-width:100%;font-size:15px;min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:0 8px;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;}
  .riga-editor-row .rr-amounts{display:flex;gap:8px;min-width:0;}
  .riga-editor-row .rr-amounts input{flex:1;min-width:0;font-size:16px;min-height:44px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:0 10px;}
  .riga-editor-row .rrRiclass{width:100%;font-size:15px;min-height:40px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:0 10px;margin-top:2px;box-sizing:border-box;}
  .riga-editor-row .rr-remove{
    flex:0 0 auto;border:none;background:var(--danger-soft);color:var(--danger);font-size:16px;font-weight:700;cursor:pointer;
    width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  }
  .quadratura-check{
    display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;
    padding:12px 14px;border-radius:12px;margin:12px 0;flex-wrap:wrap;gap:6px;
  }
  .quadratura-check.ok{background:var(--success-soft);color:var(--success);}
  .quadratura-check.bad{background:var(--danger-soft);color:var(--danger);}
  .form-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .form-actions .btn{width:100%;}
  .pluriennale-badge{
    display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--warn);
    background:var(--warn-soft);padding:2px 7px;border-radius:6px;margin-left:8px;
  }

  .modelli-row{
    display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 16px;padding-left:16px;padding-right:16px;
    scrollbar-width:thin;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  }
  .modello-card{
    flex:0 0 auto;width:78vw;max-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;scroll-snap-align:start;
  }
  .modello-card .mc-nome{font-size:13.5px;font-weight:700;line-height:1.3;min-height:34px;}
  .modello-card .mc-righe{font-size:11.5px;color:var(--text-faint);line-height:1.5;}
  .modello-card .mc-actions{display:flex;gap:6px;margin-top:auto;}
  .modello-card .mc-actions button{flex:1;}
  .modello-card.new{
    align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer;
    border-style:dashed;min-height:130px;font-weight:700;font-size:13px;text-align:center;
  }
  input::placeholder, select.placeholder-like{color:var(--text-faint); opacity:.85; font-style:italic;}
  .lato-toggle{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .lato-toggle button{flex:1;border:none;background:var(--surface-2);color:var(--text-dim);font-size:12.5px;font-weight:700;padding:7px;cursor:pointer;}
  .lato-toggle button.active{background:var(--primary);color:#fff;}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>Nordev — Contabilità</h1>
        <div class="sub" id="subHeader">—</div>
      </div>
      <span class="badge ok" id="quadraturaBadge">✓ Quadra</span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="riepilogo" class="active">Riepilogo</button>
      <button data-tab="giornale">Giornale</button>
      <button data-tab="piano">Piano dei Conti</button>
      <button data-tab="bilancio">Bilancio</button>
    </nav>
  </div>
</header>

<main class="wrap">

  <section class="view active" id="view-riepilogo">
    <div class="draft-banner" id="draftBanner" style="display:none;"></div>
    <div class="cards-grid" id="statCards"></div>

    <button class="btn primary btn-block" id="btnNuovaRiepilogo">＋ Nuova registrazione</button>
    <div class="toolbar-secondary">
      <button class="btn secondary" id="btnExport"><span>⭳</span> Esporta dati</button>
      <label class="btn secondary" for="importFile"><span>⭱</span> Importa dati</label>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>

    <h2 class="section-title">Ultimi movimenti</h2>
    <div id="riepilogoMovimenti"></div>

    <h2 class="section-title">Note</h2>
    <div class="panel">
      <p class="panel-note" id="riepilogoNote"></p>
    </div>
  </section>

  <section class="view" id="view-giornale">
    <button class="btn primary btn-block" id="btnNuovaGiornale">＋ Nuova registrazione (vuota)</button>

    <h2 class="section-title">Modelli rapidi</h2>
    <div class="modelli-row" id="modelliRow"></div>

    <div id="formPanel" class="form-panel" style="display:none;"></div>
    <div id="modelloEditorPanel" class="form-panel" style="display:none;"></div>

    <div class="searchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="giornaleSearch" placeholder="Cerca per conto o descrizione…">
    </div>
    <div class="chiprow" id="riclassChips"></div>
    <div id="giornaleList"></div>
  </section>

  <section class="view" id="view-piano">
    <div class="searchbar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="pianoSearch" placeholder="Cerca codice o voce di conto…">
    </div>
    <div id="pianoList"></div>
  </section>

  <section class="view" id="view-bilancio">
    <div class="subtabs" id="bilancioSubtabs">
      <button data-sub="sp" class="active">Stato Patrimoniale</button>
      <button data-sub="ce">Conto Economico</button>
    </div>
    <div class="chiprow" id="anniChips"></div>
    <div class="toggle-row">
      <span>Mostra anche le voci a zero</span>
      <div class="switch" id="zeroSwitch"></div>
    </div>
    <div class="note-box" id="bilancioNote" style="display:none;"></div>
    <div id="bilancioBody"></div>
  </section>

</main>

<footer class="foot">
  Dati estratti da <span id="footFonte"></span> · generato il <span id="footData"></span><br>
  Istantanea statica — per aggiornare, rigenerare la pagina dal file Excel.
</footer>

<script>
const INITIAL_DATA = {
  "meta": {
    "progetto": "Nordev — Contabilità",

// ---------- Ledger engine: compute account balances & summary live from movimenti ----------
function buildPianoIndex(piano){
  const idx = {};
  for(const p of piano){
    if(p.sep || p.header) continue;
    idx[String(p.codice)] = p;
  }
  return idx;
}

function computeSaldi(state){
  const idx = buildPianoIndex(state.piano);
  const acc = {};
  for(const code in idx) acc[code] = {dare:0, avere:0};
  for(const m of state.movimenti){
    for(const r of m.righe){
      const code = String(r.codice);
      if(!acc[code]) acc[code] = {dare:0, avere:0};
      acc[code].dare += Number(r.dare)||0;
      acc[code].avere += Number(r.avere)||0;
    }
  }
  const out = {};
  for(const code in acc){
    const {dare, avere} = acc[code];
    const raw = dare - avere;
    const tipo = idx[code] ? idx[code].tipo : '';
    out[code] = {
      dare, avere, raw,
      mag: Math.abs(raw),
      lato: raw >= 0 ? 'Dare' : 'Avere',
      tipo,
    };
  }
  return out;
}

function computeRiepilogo(state, saldi){
  let ricavi=0, costi=0, totAttivo=0, totPassivo=0, dareGlobale=0, avereGlobale=0;
  const idx = buildPianoIndex(state.piano);
  for(const code in saldi){
    const s = saldi[code];
    const tipo = idx[code] ? idx[code].tipo : '';
    dareGlobale += s.dare; avereGlobale += s.avere;
    if(tipo && tipo.startsWith('Attivo')) totAttivo += s.raw;
    if(tipo && tipo.startsWith('Passivo')) totPassivo += -s.raw;
    if(tipo === 'Conto economico' || tipo === 'Conto economico rettificativo'){
      const val = -s.raw; // avere - dare: ricavi positivi, costi negativi
      if(val >= 0) ricavi += val; else costi += -val;
    }
  }
  const utile = ricavi - costi;
  const cassa = (saldi['15.1']?.raw||0) + (saldi['15.2']?.raw||0) + (saldi['15.3']?.raw||0) + (saldi['15.4']?.raw||0);
  const crediti = saldi['14.1'] ? Math.max(saldi['14.1'].raw,0) : 0;
  const sorted = state.movimenti.slice().sort((a,b)=> new Date(a.data) - new Date(b.data));
  const ultimo = sorted.length ? sorted[sorted.length-1].data : null;
  return {
    cassa, ricavi, costi, utile, crediti,
    totAttivo, totPassivo,
    nMovimenti: state.movimenti.length,
    ultimoMovimento: ultimo,
    quadratura: {dare: Math.round(dareGlobale*100)/100, avere: Math.round(avereGlobale*100)/100, ok: Math.abs(dareGlobale-avereGlobale) < 0.005},
  };
}

// ---------- Piano dei conti ----------
function tipoPillClass(tipo, codice){
  if(!tipo) return 'transitorio';
  if(tipo.startsWith('Attivo')) return 'attivo';
  if(tipo.startsWith('Passivo')) return 'passivo';
  if(tipo.startsWith('Conto economico')) return (codice>=50) ? 'ricavo' : 'costo';
  if(tipo==='Transitorio') return 'transitorio';
  if(tipo==='Chiusura') return 'chiusura';
  return 'transitorio';
}

function buildPianoGroups(piano){
  const groups = [];
  let current = null;
  for(const p of piano){
    if(p.sep){ continue; }
    if(p.header){
      current = {title: p.conto, codice: p.codice, items: []};
      groups.push(current);
    } else if(current){
      current.items.push(p);
    }
  }
  return groups;
}

let PIANO_INDEX = {};
let PIANO_GROUPS = [];
let PIANO_LEAVES = [];
function rebuildPianoCaches(){
  PIANO_INDEX = buildPianoIndex(STATE.piano);
  PIANO_GROUPS = buildPianoGroups(STATE.piano);
  PIANO_LEAVES = STATE.piano.filter(p=>!p.sep && !p.header);
}

function renderPiano(filter=''){
  const saldi = computeSaldi(STATE);
  const f = filter.trim().toLowerCase();
  const container = document.getElementById('pianoList');
  let html = '';
  let anyMatch = false;
  for(const g of PIANO_GROUPS){
    const items = g.items.filter(it=>{
      if(!f) return true;
      return (String(it.codice)+' '+it.conto).toLowerCase().includes(f);
    });
    if(items.length===0) continue;
    anyMatch = true;
    const hasBalance = items.some(it=> (saldi[String(it.codice)]?.mag||0) > 0);
    const openAttr = (f || hasBalance) ? 'open' : '';
    html += `<details class="cat" ${openAttr}>
      <summary><span>${g.title}</span><span class="chev">▸</span></summary>
      <div class="cat-items">
        ${items.map(it=>{
          const cls = tipoPillClass(it.tipo, it.codice);
          const s = saldi[String(it.codice)];
          const hasVal = s && s.mag > 0;
          const saldoTxt = s ? `${money(s.mag)} <span style="opacity:.6;font-weight:600;">${s.lato}</span>` : '—';
          const saldoCls = !hasVal ? 'zero' : '';
          return `<div class="conto-row">
            <div class="conto-left">
              <span class="conto-name">${it.conto}</span>
              <span class="conto-code">${it.codice}</span>
            </div>
            <div class="conto-right">
              <span class="pill ${cls}">${it.tipo||'—'}</span>
              <span class="saldo-val ${saldoCls}">${saldoTxt}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </details>`;
  }
  container.innerHTML = anyMatch ? html : '<div class="empty">Nessun conto trovato.</div>';
}

          </div>
          <div class="rr-amounts">
            <input type="number" step="0.01" min="0" class="rrDare" placeholder="${r.phDare ? ('es. '+r.phDare+' €') : 'Dare €'}" value="${r.dare}">
            <input type="number" step="0.01" min="0" class="rrAvere" placeholder="${r.phAvere ? ('es. '+r.phAvere+' €') : 'Avere €'}" value="${r.avere}">
          </div>
          <input type="text" class="rrRiclass" list="riclassOptions" placeholder="Etichetta / riclassificazione (opzionale)" value="${(r.riclass||'').replace(/"/g,'&quot;')}">
        </div>
      `).join('')}
      <datalist id="riclassOptions">${riclassDatalistHTML()}</datalist>
      <button type="button" class="btn small" id="btnAddRiga">＋ Aggiungi riga</button>
    </div>

    <div class="quadratura-check ${ok ? 'ok' : 'bad'}">
      <span>Dare ${money(t.dare)} · Avere ${money(t.avere)}</span>
      <span>${ok ? '✓ Quadra' : '✗ Non quadra ancora'}</span>
    </div>

    <div class="form-actions">
      <button class="btn primary" id="btnSalvaMovimento" ${ok?'':'disabled'}>Salva registrazione</button>
      <button class="btn" id="btnAnnullaMovimento">Annulla</button>
    </div>
  `;

  panel.querySelectorAll('.riga-editor-row').forEach(row=>{
    const idx = Number(row.dataset.idx);
    row.querySelector('.rrConto').addEventListener('change', e=>{ formRighe[idx].codice = e.target.value; });
    row.querySelector('.rrDare').addEventListener('input', e=>{
      formRighe[idx].dare = e.target.value;
      if(e.target.value !== '' && Number(e.target.value) !== 0){
        formRighe[idx].avere = '';
        row.querySelector('.rrAvere').value = '';
      }
      updateQuadraturaDisplay();
    });
    row.querySelector('.rrAvere').addEventListener('input', e=>{
      formRighe[idx].avere = e.target.value;
      if(e.target.value !== '' && Number(e.target.value) !== 0){
        formRighe[idx].dare = '';
        row.querySelector('.rrDare').value = '';
      }
      updateQuadraturaDisplay();
    });
    row.querySelector('.rrRiclass').addEventListener('input', e=>{ formRighe[idx].riclass = e.target.value; });
  });
  panel.querySelectorAll('[data-remove]').forEach(b=>{
    b.addEventListener('click', ()=> removeFormRiga(Number(b.dataset.remove)));
  });
  document.getElementById('btnAddRiga').addEventListener('click', ()=> addFormRiga());
  document.getElementById('fData').addEventListener('input', e=> formDate = e.target.value);
  document.getElementById('fDesc').addEventListener('input', e=> formDesc = e.target.value);
  document.getElementById('pluriSwitch').addEventListener('click', ()=>{ formPluriennale = !formPluriennale; renderForm(); });
  if(formPluriennale){
    document.getElementById('fCompDal').addEventListener('input', e=> formCompDal = e.target.value);
    document.getElementById('fCompAl').addEventListener('input', e=> formCompAl = e.target.value);
  }
  document.getElementById('btnSalvaMovimento').addEventListener('click', salvaMovimento);
  document.getElementById('btnAnnullaMovimento').addEventListener('click', chiudiForm);
  document.getElementById('btnChiudiFormX').addEventListener('click', chiudiForm);
}

function updateQuadraturaDisplay(){
  const t = formTotals();
  const ok = formRighe.length>=2 && Math.abs(t.dare-t.avere) < 0.005 && t.dare>0;
  const qc = document.querySelector('#formPanel .quadratura-check');
  if(qc){
    qc.className = 'quadratura-check ' + (ok ? 'ok' : 'bad');
    qc.innerHTML = `<span>Dare ${money(t.dare)} · Avere ${money(t.avere)}</span><span>${ok ? '✓ Quadra' : '✗ Non quadra ancora'}</span>`;
  }
  const btn = document.getElementById('btnSalvaMovimento');
  if(btn) btn.disabled = !ok;
}

let formDate='', formDesc='', formPluriennale=false, formCompDal='', formCompAl='', formDescPlaceholder='es. Vendita a cliente Rossi';

function apriForm(template){
  chiudiModelloEditor();
  const today = new Date().toISOString().slice(0,10);
  formDate = today; formDesc=''; formCompDal=''; formCompAl='';
  if(template){
    formDescPlaceholder = template.descrizione || 'es. Vendita a cliente Rossi';
    formPluriennale = !!template.pluriennale;
    formRighe = template.righe.map(tr => ({
      codice: tr.codice, dare:'', avere:'', riclass: tr.riclass || '',
      phDare: tr.lato==='dare' ? tr.esempio : '',
      phAvere: tr.lato==='avere' ? tr.esempio : '',
    }));
  } else {
    formDescPlaceholder = 'es. Vendita a cliente Rossi';
    formPluriennale = false;
    formRighe = [{codice:'',dare:'',avere:'',riclass:'',phDare:'',phAvere:''},{codice:'',dare:'',avere:'',riclass:'',phDare:'',phAvere:''}];
  }
  document.getElementById('formPanel').style.display = 'block';
  renderForm();
  goToTab('giornale');
  document.getElementById('formPanel').scrollIntoView({behavior:'smooth', block:'start'});
}
function chiudiForm(){
  document.getElementById('formPanel').style.display = 'none';
  document.getElementById('formPanel').innerHTML = '';
}
function salvaMovimento(){
  const t = formTotals();
  if(formRighe.length<2 || Math.abs(t.dare-t.avere)>=0.005 || t.dare<=0){ return; }
  if(formRighe.some(r=>!r.codice)){ alert('Seleziona un conto per ogni riga.'); return; }
  const id = 'm' + (STATE.movimenti.length + 1) + '_' + Date.now().toString(36);
  STATE.movimenti.push({
    id,
    data: formDate || new Date().toISOString().slice(0,10),
    descrizione: formDesc || 'Registrazione contabile',
    competenzaDal: formPluriennale ? (formCompDal||null) : null,
    competenzaAl: formPluriennale ? (formCompAl||null) : null,
    righe: formRighe.map(r=>({codice:r.codice, dare:Number(r.dare)||0, avere:Number(r.avere)||0, riclass:r.riclass||null})),
  });
  saveState();
  chiudiForm();
  renderAll();
}

document.getElementById('btnNuovaRiepilogo').addEventListener('click', ()=>apriForm());
document.getElementById('btnNuovaGiornale').addEventListener('click', ()=>apriForm());

// ---------- Modelli rapidi ----------
function contoLabel(codice){
  const p = PIANO_INDEX[String(codice)];
  return p ? `${codice} — ${p.conto}` : (codice || '—');
}

function renderModelli(){
  const container = document.getElementById('modelliRow');
  const cards = (STATE.modelli||[]).map(m=>{
    const righeTxt = m.righe.map(r=> `${r.lato==='dare'?'Dare':'Avere'}: ${contoLabel(r.codice)}`).join(' · ');
    return `
      <div class="modello-card" data-id="${m.id}">
        <div class="mc-nome">${m.nome}${m.pluriennale ? ' <span class="pluriennale-badge">⏳</span>' : ''}</div>
        <div class="mc-righe">${righeTxt}</div>
        <div class="mc-actions">
          <button class="btn small primary" data-use="${m.id}">Usa</button>
          <button class="btn small" data-edit="${m.id}" title="Modifica">✎</button>
          <button class="btn small danger" data-del="${m.id}" title="Elimina">🗑</button>
        </div>
      </div>
    `;
  }).join('');
  container.innerHTML = cards + `<div class="modello-card new" id="btnNuovoModello">＋<br>Nuovo modello</div>`;

  container.querySelectorAll('[data-use]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const tpl = STATE.modelli.find(m=>m.id===b.dataset.use);
      if(tpl) apriForm(tpl);
    });
  });
  container.querySelectorAll('[data-edit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const tpl = STATE.modelli.find(m=>m.id===b.dataset.edit);
      if(tpl) apriModelloEditor(tpl);
    });
  });
  container.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const tpl = STATE.modelli.find(m=>m.id===b.dataset.del);
      if(!tpl) return;
      if(!confirm(`Eliminare il modello "${tpl.nome}"?`)) return;
      STATE.modelli = STATE.modelli.filter(m=>m.id!==tpl.id);
      saveState();
      renderModelli();
    });
  });
  document.getElementById('btnNuovoModello').addEventListener('click', ()=> apriModelloEditor(null));
}

let modelloEditId = null, modelloNome='', modelloDescrizione='', modelloPluriennale=false, modelloRighe=[];

function apriModelloEditor(existing){
  chiudiForm();
  if(existing){
    modelloEditId = existing.id;
    modelloNome = existing.nome;
    modelloDescrizione = existing.descrizione || '';
    modelloPluriennale = !!existing.pluriennale;
    modelloRighe = existing.righe.map(r=>({...r}));
  } else {
    modelloEditId = null;
    modelloNome = '';
    modelloDescrizione = '';
    modelloPluriennale = false;
    modelloRighe = [{codice:'',lato:'dare',esempio:'',riclass:''},{codice:'',lato:'avere',esempio:'',riclass:''}];
  }
  document.getElementById('modelloEditorPanel').style.display = 'block';
  renderModelloEditor();
  goToTab('giornale');
  document.getElementById('modelloEditorPanel').scrollIntoView({behavior:'smooth', block:'start'});
}
function chiudiModelloEditor(){
  document.getElementById('modelloEditorPanel').style.display = 'none';
  document.getElementById('modelloEditorPanel').innerHTML = '';
}

function renderModelloEditor(){
  const panel = document.getElementById('modelloEditorPanel');
  panel.innerHTML = `
    <div class="form-panel-head">
      <h3>${modelloEditId ? 'Modifica modello' : 'Nuovo modello'}</h3>
      <button type="button" class="form-close" id="btnChiudiModelloX" title="Chiudi">✕</button>
    </div>
    <div class="field"><label>Nome del modello</label><input type="text" id="mNome" placeholder="es. Vendita con incasso immediato" value="${modelloNome.replace(/"/g,'&quot;')}"></div>
    <div class="field"><label>Testo di esempio per la descrizione</label><input type="text" id="mDesc" placeholder="es. Vendita a [cliente] – [servizio]" value="${modelloDescrizione.replace(/"/g,'&quot;')}"></div>
    <div class="competenza-toggle" id="mPluriToggle">
      <div class="switch ${modelloPluriennale?'on':''}" id="mPluriSwitch"></div>
      <span>Le registrazioni create da questo modello sono di norma pluriennali (competenza a cavallo di due esercizi)</span>
    </div>
    <div class="righe-editor">
      ${modelloRighe.map((r,i)=>`
        <div class="riga-editor-row" data-midx="${i}">
          <div class="rr-top">
            <select class="mrConto">${pianoOptionsHTML(r.codice)}</select>
            <button type="button" class="rr-remove" data-mremove="${i}">✕</button>
          </div>
          <div class="lato-toggle">
            <button type="button" class="mrLato ${r.lato==='dare'?'active':''}" data-lato="dare">Dare</button>
            <button type="button" class="mrLato ${r.lato==='avere'?'active':''}" data-lato="avere">Avere</button>
          </div>
          <input type="number" step="0.01" min="0" class="mrEsempio" placeholder="Importo di esempio (solo guida)" value="${r.esempio}">
          <input type="text" class="mrRiclass" list="riclassOptions" placeholder="Etichetta / riclassificazione di default (opzionale)" value="${(r.riclass||'').replace(/"/g,'&quot;')}">
        </div>
      `).join('')}
      <datalist id="riclassOptions">${riclassDatalistHTML()}</datalist>
      <button type="button" class="btn small" id="btnAddRigaModello">＋ Aggiungi riga</button>
    </div>
    <div class="form-actions">
      <button class="btn primary" id="btnSalvaModello">Salva modello</button>
      <button class="btn" id="btnAnnullaModello">Annulla</button>
      ${modelloEditId ? '<button class="btn danger" id="btnEliminaModello">Elimina</button>' : ''}
    </div>
  `;

  panel.querySelectorAll('.riga-editor-row').forEach(row=>{
    const idx = Number(row.dataset.midx);
    row.querySelector('.mrConto').addEventListener('change', e=>{ modelloRighe[idx].codice = e.target.value; });
    row.querySelector('.mrEsempio').addEventListener('input', e=>{ modelloRighe[idx].esempio = e.target.value; });
    row.querySelector('.mrRiclass').addEventListener('input', e=>{ modelloRighe[idx].riclass = e.target.value; });
    row.querySelectorAll('.mrLato').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        modelloRighe[idx].lato = btn.dataset.lato;
        renderModelloEditor();
      });
    });
  });
  panel.querySelectorAll('[data-mremove]').forEach(b=>{
    b.addEventListener('click', ()=>{ modelloRighe.splice(Number(b.dataset.mremove),1); renderModelloEditor(); });
  });
  document.getElementById('btnAddRigaModello').addEventListener('click', ()=>{
    modelloRighe.push({codice:'',lato:'dare',esempio:'',riclass:''});
    renderModelloEditor();
  });
  document.getElementById('mNome').addEventListener('input', e=> modelloNome = e.target.value);
  document.getElementById('mDesc').addEventListener('input', e=> modelloDescrizione = e.target.value);
  document.getElementById('mPluriSwitch').addEventListener('click', ()=>{ modelloPluriennale = !modelloPluriennale; renderModelloEditor(); });
  document.getElementById('btnSalvaModello').addEventListener('click', salvaModello);
  document.getElementById('btnAnnullaModello').addEventListener('click', chiudiModelloEditor);
  document.getElementById('btnChiudiModelloX').addEventListener('click', chiudiModelloEditor);
  const delBtn = document.getElementById('btnEliminaModello');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(!confirm(`Eliminare il modello "${modelloNome}"?`)) return;
    STATE.modelli = STATE.modelli.filter(m=>m.id!==modelloEditId);
    saveState();
    chiudiModelloEditor();
    renderModelli();
  });
}

function salvaModello(){
  if(!modelloNome.trim()){ alert('Dai un nome al modello.'); return; }
  if(modelloRighe.length<2 || modelloRighe.some(r=>!r.codice)){ alert('Seleziona un conto per ogni riga (almeno due righe).'); return; }
  const nuovo = {
    id: modelloEditId || ('tpl-custom-' + Date.now().toString(36)),
    nome: modelloNome.trim(),
    descrizione: modelloDescrizione.trim(),
    pluriennale: modelloPluriennale,
    righe: modelloRighe.map(r=>({codice:r.codice, lato:r.lato, esempio: Number(r.esempio)||0, riclass: r.riclass||''})),
  };
  if(!STATE.modelli) STATE.modelli = [];
  if(modelloEditId){
    STATE.modelli = STATE.modelli.map(m=> m.id===modelloEditId ? nuovo : m);
  } else {
    STATE.modelli.push(nuovo);
  }
  saveState();
  chiudiModelloEditor();
  renderModelli();
}

// ---------- Export / Import ----------
document.getElementById('btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(STATE, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'data.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.piano || !parsed.movimenti) throw new Error('formato non valido');
      STATE = parsed;
      saveState();
      renderAll();
      alert('Dati importati correttamente.');
    }catch(err){
      alert('File non valido: ' + err.message);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

// ---------- init ----------
function renderAll(){
  rebuildPianoCaches();
  renderHeader();
  renderRiepilogo();
  renderGiornale();
  renderModelli();
  renderPiano(document.getElementById('pianoSearch').value||'');
  renderBilancio();
}
if(!STATE.modelli) STATE.modelli = [];
renderAll();
</script>
</body>
</html>
