<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nordev — Contabilità</title>
<style>
  :root{
    --bg:#f4f5f9;
    --surface:#ffffff;
    --surface-2:#f8f9fc;
    --border:#e4e6ee;
    --text:#171923;
    --text-dim:#5b6172;
    --text-faint:#8b90a0;
    --primary:#4338ca;
    --primary-soft:#eef0fd;
    --success:#0f9d58;
    --success-soft:#e7f7ee;
    --danger:#d93025;
    --danger-soft:#fdeceb;
    --warn:#b5730a;
    --warn-soft:#fbf1de;
    --neutral-soft:#eef0f4;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 2px rgba(20,20,43,.04), 0 6px 20px rgba(20,20,43,.06);
    --maxw:880px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1117;
      --surface:#171a23;
      --surface-2:#1d2029;
      --border:#2a2e3a;
      --text:#eef0f6;
      --text-dim:#a5aabb;
      --text-faint:#767c8f;
      --primary:#8b93f8;
      --primary-soft:#242a4d;
      --success:#4ade80;
      --success-soft:#123322;
      --danger:#f87171;
      --danger-soft:#3a1c1c;
      --warn:#f5b942;
      --warn-soft:#3a2f14;
      --neutral-soft:#242833;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
  }
  a{color:inherit;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px;}

  header.top{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;gap:12px;}
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;}
  .brand .sub{font-size:12.5px;color:var(--text-faint);margin-top:2px;}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;
  }
  .badge.ok{background:var(--success-soft);color:var(--success);}
  .badge.warn{background:var(--warn-soft);color:var(--warn);}
  .badge.bad{background:var(--danger-soft);color:var(--danger);}
  .badge.neutral{background:var(--neutral-soft);color:var(--text-dim);}

  nav.tabs{
    display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{
    flex:0 0 auto;
    border:none;background:transparent;color:var(--text-dim);
    font-size:14px;font-weight:600;padding:9px 14px;border-radius:99px;cursor:pointer;
    transition:background .15s, color .15s;
    white-space:nowrap;
  }
  nav.tabs button.active{background:var(--primary);color:#fff;}
  nav.tabs button:not(.active):hover{background:var(--surface-2);}

  main{padding-top:16px;}
  section.view{display:none;}
  section.view.active{display:block;animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  h2.section-title{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin:22px 0 10px;font-weight:700;}
  h2.section-title:first-child{margin-top:0;}

  .cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media (min-width:560px){.cards-grid{grid-template-columns:repeat(4,1fr);}}
  .stat-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:14px 14px 12px;box-shadow:var(--shadow);
  }
  .stat-card .label{font-size:12px;color:var(--text-faint);font-weight:600;margin-bottom:6px;}
  .stat-card .value{font-size:20px;font-weight:700;letter-spacing:-.01em;}
  .stat-card .value.pos{color:var(--success);}
  .stat-card .value.neg{color:var(--danger);}
  .stat-card .foot{font-size:11.5px;color:var(--text-faint);margin-top:4px;}

  .panel{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px;
  }
  .panel-title{font-weight:700;font-size:15px;margin:0 0 4px;}
  .panel-note{font-size:13px;color:var(--text-dim);margin:0 0 10px;line-height:1.5;}

  .searchbar{
    display:flex;align-items:center;gap:8px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:14px;
  }
  .searchbar input{
    border:none;outline:none;background:transparent;color:var(--text);font-size:15px;width:100%;
  }
  .searchbar input::placeholder{color:var(--text-faint);}
  .searchbar svg{flex:0 0 auto;color:var(--text-faint);}

  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{
    border:1px solid var(--border);background:var(--surface);color:var(--text-dim);
    padding:7px 13px;border-radius:99px;font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:13.5px;color:var(--text-dim);}
  .switch{
    position:relative;width:38px;height:22px;border-radius:99px;background:var(--neutral-soft);
    border:1px solid var(--border);cursor:pointer;flex:0 0 auto;
  }
  .switch.on{background:var(--primary);border-color:var(--primary);}
  .switch::after{
    content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .switch.on::after{left:18px;}

  .movimento{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;background:var(--surface-2);}
  .movimento .mtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .movimento .mdesc{font-weight:700;font-size:14.5px;}
  .movimento .mdate{font-size:12px;color:var(--text-faint);white-space:nowrap;}
  .movimento .mamt{font-weight:700;color:var(--success);font-size:15px;margin-top:2px;}
  .righe{margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;display:grid;gap:5px;}
  .riga{display:flex;justify-content:space-between;font-size:13px;gap:8px;}
  .riga .rc{color:var(--text-dim);}
  .riga .rv{font-variant-numeric:tabular-nums;font-weight:600;}
  .riga .rv.dare{color:var(--text);}
  .riga .rv.avere{color:var(--text);}
  .tag-dare, .tag-avere{
    font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;margin-right:6px;
  }
  .tag-dare{background:var(--primary-soft);color:var(--primary);}
  .tag-avere{background:var(--warn-soft);color:var(--warn);}

  details.cat{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden;background:var(--surface-2);}
  details.cat > summary{
    list-style:none;cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;
    font-weight:700;font-size:13.5px;
  }
  details.cat > summary::-webkit-details-marker{display:none;}
  details.cat > summary .chev{transition:transform .15s;color:var(--text-faint);font-size:12px;}
  details.cat[open] > summary .chev{transform:rotate(90deg);}
  .cat-items{padding:0 14px 10px;}
  .conto-row{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:8px 0;border-top:1px solid var(--border);font-size:13.5px;
  }
  .conto-row:first-child{border-top:none;}
  .conto-left{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .conto-code{font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .conto-name{line-height:1.3;}
  .conto-right{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
  .pill{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap;}
  .pill.attivo{background:var(--primary-soft);color:var(--primary);}
  .pill.passivo{background:var(--warn-soft);color:var(--warn);}
  .pill.ricavo{background:var(--success-soft);color:var(--success);}
  .pill.costo{background:var(--danger-soft);color:var(--danger);}
  .pill.transitorio, .pill.chiusura{background:var(--neutral-soft);color:var(--text-dim);}
  .saldo-val{font-weight:700;font-variant-numeric:tabular-nums;min-width:64px;text-align:right;}
  .saldo-val.zero{color:var(--text-faint);font-weight:500;}

  .bilancio-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;font-size:13.5px;border-top:1px solid var(--border);}
  .bilancio-row:first-child{border-top:none;}
  .bilancio-row .lbl{min-width:0;}
  .bilancio-row .val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;}
  .bilancio-row.total{font-weight:700;background:var(--surface-2);margin:4px -14px;padding:9px 14px;border-radius:8px;border-top:none;}
  .bilancio-row.lvl0{font-weight:700;margin-top:6px;}
  .bilancio-row.lvl1 .lbl{padding-left:14px;}
  .bilancio-row.lvl2 .lbl{padding-left:28px;color:var(--text-dim);}
  .bilancio-row.lvl3 .lbl{padding-left:42px;color:var(--text-dim);}
  .val.na{color:var(--text-faint);font-style:italic;font-weight:500;}

  .subtabs{display:flex;gap:6px;margin-bottom:12px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--border);}
  .subtabs button{flex:1;border:none;background:transparent;padding:8px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--text-dim);cursor:pointer;}
  .subtabs button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow);}

  .empty{text-align:center;color:var(--text-faint);font-size:13.5px;padding:30px 10px;}
  footer.foot{text-align:center;color:var(--text-faint);font-size:11.5px;padding:26px 16px 10px;line-height:1.6;}
  .note-box{
    display:flex;gap:9px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.5;margin-bottom:14px;
  }
  .note-box b{color:inherit;}
</style>
</head>

    <div id="bilancioBody"></div>
  </section>

</main>

const fmtEUR = new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const fmtDate = (iso) => {
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'});
};
const money = (v) => (v===null || v===undefined) ? null : fmtEUR.format(v);

function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

// ---------- Header ----------
document.getElementById('subHeader').textContent =
  `Bozza v02 · aggiornato al ${fmtDate(DATA.riepilogo.ultimoMovimento)}`;
document.getElementById('footFonte').textContent = DATA.meta.fonte;
document.getElementById('footData').textContent = fmtDate(DATA.meta.generato);

// ---------- Tabs ----------
const tabsNav = document.getElementById('tabs');
tabsNav.addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b===btn));
  document.querySelectorAll('section.view').forEach(s=>s.classList.toggle('active', s.id === 'view-'+btn.dataset.tab));
  window.scrollTo({top:0, behavior:'instant'});
});

// ---------- Riepilogo ----------
function renderRiepilogo(){
  const r = DATA.riepilogo;
  const cards = [
    {label:'Cassa disponibile', value: money(r.cassa), cls:''},
    {label:'Ricavi 2026', value: money(r.ricavi2026), cls:'pos'},
    {label:'Utile 2026', value: money(r.utile2026), cls:'pos'},
    {label:'Crediti aperti', value: money(r.creditiAperti), cls: r.creditiAperti>0 ? 'neg':''},
  ];
  document.getElementById('statCards').innerHTML = cards.map(c=>`
    <div class="stat-card">
      <div class="label">${c.label}</div>
      <div class="value ${c.cls}">${c.value}</div>
    </div>
  `).join('');

  const mDiv = document.getElementById('riepilogoMovimenti');
  const last = DATA.movimenti.slice(-3).reverse();
  mDiv.innerHTML = last.map(movimentoCardHTML).join('') || '<div class="empty">Nessun movimento registrato.</div>';

  document.getElementById('riepilogoNote').innerHTML =
    `Il libro giornale è in quadratura (Dare ${money(r.quadratura.dare)} = Avere ${money(r.quadratura.avere)}). `+
    `Sono registrati <b>${r.nMovimenti}</b> movimenti contabili reali; tutte le altre voci del piano dei conti e del bilancio sono ancora a zero, `+
    `pronte per le prossime registrazioni. Lo Stato Patrimoniale nel file originale non risulta ancora aggiornato con l'utile del periodo: `+
    `vedi la sezione Bilancio per il dettaglio.`;
}

function movimentoCardHTML(m){
  const righe = m.righe.map(r=>`
    <div class="riga">
      <span class="rc">${r.dare ? '<span class=\"tag-dare\">DARE</span>' : '<span class=\"tag-avere\">AVERE</span>'} ${r.conto ?? ''}</span>
      <span class="rv">${money(r.dare ?? r.avere)}</span>
    </div>
  `).join('');
  return `
    <div class="movimento">
      <div class="mtop">
        <span class="mdesc">${m.descrizione}</span>
        <span class="mdate">${fmtDate(m.data)}</span>
      </div>
      <div class="mamt">${money(m.totale)}</div>
      <div class="righe">${righe}</div>
    </div>
  `;
}

// ---------- Giornale ----------
function renderGiornale(filter=''){
  const f = filter.trim().toLowerCase();
  const list = DATA.movimenti.filter(m=>{
    if(!f) return true;
    const hay = (m.descrizione + ' ' + m.righe.map(r=>r.conto).join(' ')).toLowerCase();
    return hay.includes(f);
  }).slice().reverse();
  document.getElementById('giornaleList').innerHTML =
    list.map(movimentoCardHTML).join('') || '<div class="empty">Nessun movimento trovato.</div>';
}
document.getElementById('giornaleSearch').addEventListener('input', e=>renderGiornale(e.target.value));

// ---------- Piano dei conti ----------
function tipoPillClass(tipo, codice){
  if(!tipo) return 'transitorio';
  if(tipo.startsWith('Attivo')) return 'attivo';
  if(tipo.startsWith('Passivo')) return 'passivo';
  if(tipo.startsWith('Conto economico')) return (codice>=50) ? 'ricavo' : 'costo';
  if(tipo==='Transitorio') return 'transitorio';
  if(tipo==='Chiusura') return 'chiusura';
  return 'transitorio';
}

function buildPianoGroups(){
  const groups = [];
  let current = null;
  for(const p of DATA.piano){
    if(p.sep){ continue; }
    if(p.header){
      current = {title: p.conto, codice: p.codice, items: []};
      groups.push(current);
    } else if(current){
      current.items.push(p);
    }
  }
  return groups;
}
const PIANO_GROUPS = buildPianoGroups();

function renderPiano(filter=''){
  const f = filter.trim().toLowerCase();
  const container = document.getElementById('pianoList');
  let html = '';
  let anyMatch = false;
  for(const g of PIANO_GROUPS){
    const items = g.items.filter(it=>{
      if(!f) return true;
      return (String(it.codice)+' '+it.conto).toLowerCase().includes(f);
    });
    if(items.length===0) continue;
    anyMatch = true;
    const hasBalance = items.some(it=>it.saldo);
    const openAttr = (f || hasBalance) ? 'open' : '';
    html += `<details class="cat" ${openAttr}>
      <summary><span>${g.title}</span><span class="chev">▸</span></summary>
      <div class="cat-items">
        ${items.map(it=>{
          const cls = tipoPillClass(it.tipo, it.codice);
          const hasVal = it.saldo !== null && it.saldo !== undefined;
          const saldoTxt = hasVal ? money(it.saldo) : '—';
          const saldoCls = (!hasVal || it.saldo===0) ? 'zero' : '';
          return `<div class="conto-row">
            <div class="conto-left">
              <span class="conto-name">${it.conto}</span>
              <span class="conto-code">${it.codice}</span>
            </div>
            <div class="conto-right">
              <span class="pill ${cls}">${it.tipo||'—'}</span>
              <span class="saldo-val ${saldoCls}">${saldoTxt}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </details>`;
  }
  container.innerHTML = anyMatch ? html : '<div class="empty">Nessun conto trovato.</div>';
}
document.getElementById('pianoSearch').addEventListener('input', e=>renderPiano(e.target.value));

// ---------- Bilancio ----------
let bilState = {sub:'sp', year:0, showZero:false};
const ANNI = ['2026','2027','2028'];

document.getElementById('anniChips').innerHTML = ANNI.map((a,i)=>
  `<button class="chip ${i===0?'active':''}" data-year="${i}">${a}</button>`
).join('');
document.getElementById('anniChips').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-year]');
  if(!btn) return;
  bilState.year = Number(btn.dataset.year);
  document.querySelectorAll('#anniChips .chip').forEach(c=>c.classList.toggle('active', c===btn));
  renderBilancio();
});

document.getElementById('bilancioSubtabs').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-sub]');
  if(!btn) return;
  bilState.sub = btn.dataset.sub;
  document.querySelectorAll('#bilancioSubtabs button').forEach(b=>b.classList.toggle('active', b===btn));
  renderBilancio();
});

const zeroSwitch = document.getElementById('zeroSwitch');
zeroSwitch.addEventListener('click', ()=>{
  bilState.showZero = !bilState.showZero;
  zeroSwitch.classList.toggle('on', bilState.showZero);
  renderBilancio();
});

function rowVisible(row, yearIdx){
  if(bilState.showZero) return true;
  if(row.total) return true;
  const v = row.values ? row.values[yearIdx] : null;
  if(v===null || v===undefined) return true;
  return v !== 0;
}

function bilancioRowsHTML(rows, yearIdx){
  return rows.filter(r=>rowVisible(r, yearIdx)).map(r=>{
    const v = r.values ? r.values[yearIdx] : null;
    const isPureHeader = !r.values || r.values.every(x => x===null || x===undefined);
    let valTxt;
    if(isPureHeader){
      valTxt = '<span class="val"></span>';
    } else if(v===null || v===undefined){
      valTxt = '<span class="val na">n.d.</span>';
    } else {
      valTxt = `<span class="val">${money(v)}</span>`;
    }
    const cls = ['bilancio-row', 'lvl'+r.level, r.total?'total':''].join(' ').trim();
    return `<div class="${cls}"><span class="lbl">${r.label}</span>${valTxt}</div>`;
  }).join('');
}

function renderBilancio(){
  const yearIdx = bilState.year;
  const body = document.getElementById('bilancioBody');
  const noteBox = document.getElementById('bilancioNote');

  if(bilState.sub === 'sp'){
    noteBox.style.display = 'flex';
    noteBox.innerHTML = `<span>⚠️</span><span><b>Bozza non aggiornata:</b> nel file originale lo Stato Patrimoniale non riflette ancora l'utile del periodo (Cassa e Ricavi sono corretti nel Giornale e nel Conto Economico, ma il Patrimonio Netto risulta ancora a zero). Da verificare/aggiornare nel file sorgente.</span>`;
    body.innerHTML = `
      <div class="panel">
        <p class="panel-title">Attivo</p>
        ${bilancioRowsHTML(DATA.bilancio.attivo.filter(r=>r.label!=='STATO PATRIMONIALE' && r.label!=='Attivo'), yearIdx)}
      </div>
      <div class="panel">
        <p class="panel-title">Passivo</p>
        ${bilancioRowsHTML(DATA.bilancio.passivo.filter(r=>r.label!=='Passivo'), yearIdx)}
      </div>
    `;
  } else {
    noteBox.style.display = 'none';
    body.innerHTML = `
      <div class="panel">
        <p class="panel-title">Conto Economico</p>
        ${bilancioRowsHTML(DATA.bilancio.ce, yearIdx)}
      </div>
    `;
  }
}

// ---------- init ----------
renderRiepilogo();
renderGiornale();
renderPiano();
renderBilancio();
</script>
